spring.application.name=backend

# Clave utilizada para firmar los JWT
security.jwt.private-key=${JWT_PRIVATE_KEY}
security.jwt.user.generator=AUTH-JWT

spring.datasource.url=jdbc:postgresql://localhost:5432/invoice-management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

mp_client_id=${MP_CLIENT_ID}
mp_client_secret=${MP_CLIENT_SECRET}

spring.profiles.active=dev

